<!doctype html>
<html lang="vi" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#145f55">
  <meta name="description" content="Hồ sơ Nhà Mình — quản lý giấy tờ, sức khỏe, nhà đất và thu chi gia đình, lưu mã hóa trên thiết bị.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hồ sơ nhà mình">
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=3.2.2">
  <title>Hồ sơ nhà mình – V3.2.2 TEST</title>
</head>
<body>
  <div class="app-shell">
    <section id="authScreen" class="auth-screen">
      <div class="auth-decor one"></div><div class="auth-decor two"></div>
      <div class="auth-inner">
        <div class="logo-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/><path d="M12 7v3"/></svg>
        </div>
        <div class="eyebrow">KHÔNG GIAN RIÊNG CỦA GIA ĐÌNH</div>
        <h1>Hồ sơ<br><em>nhà mình.</em></h1>
        <p class="auth-intro">Giấy tờ, sức khỏe, nhà đất và tài chính — gọn gàng, dễ tìm, luôn trong tầm tay.</p>
        <div id="authContent"></div>
        <p class="auth-privacy"><span aria-hidden="true">🔒</span> Dữ liệu được mã hóa và lưu ngay trên thiết bị này. · V3.2.2</p>
      </div>
    </section>

    <section id="mainApp" class="main-app hidden" aria-label="Ứng dụng Hồ sơ nhà mình">
      <header class="topbar">
        <div class="topbar-title"><div class="small-mark" aria-hidden="true">⌂</div><div><span class="topbar-overline">QUẢN LÝ GIA ĐÌNH · V3.2.2</span><strong id="pageTitle">Tổng quan</strong></div></div>
        <button class="round-icon" id="topLock" title="Khóa ứng dụng" aria-label="Khóa ứng dụng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
      </header>
      <main id="view" class="main-content"></main>
      <button id="fab" class="fab" aria-label="Thêm mới" title="Thêm mới"><span>＋</span></button>
      <nav class="bottom-nav" aria-label="Điều hướng chính">
        <button data-nav="home" class="nav-btn active"><span class="nav-ico">⌂</span><span>Tổng quan</span></button>
        <button data-nav="records" class="nav-btn"><span class="nav-ico">▤</span><span>Hồ sơ</span></button>
        <button data-nav="finance" class="nav-btn"><span class="nav-ico">◉</span><span>Thu chi</span></button>
        <button data-nav="members" class="nav-btn"><span class="nav-ico">♧</span><span>Gia đình</span></button>
        <button data-nav="settings" class="nav-btn"><span class="nav-ico">⚙</span><span>Cài đặt</span></button>
      </nav>
    </section>
  </div>

  <dialog id="modal" aria-modal="true"><div id="modalBody"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="backupFile" type="file" accept=".hsgd,.json,application/json" class="hidden" aria-label="Chọn tệp sao lưu">
  <script src="./app.js?v=3.2.2" defer></script>
  <script src="./sync.js?v=3.2.2" defer></script>
</body>
</html>
